<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starry Link Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.stars{
    position:fixed;
    inset:0;
    background:
        radial-gradient(2px 2px at 20px 30px,#fff,transparent),
        radial-gradient(2px 2px at 90px 80px,#fff,transparent),
        radial-gradient(1.5px 1.5px at 160px 50px,#fff,transparent),
        radial-gradient(2px 2px at 240px 120px,#fff,transparent),
        radial-gradient(1.5px 1.5px at 320px 70px,#fff,transparent),
        radial-gradient(2px 2px at 420px 140px,#fff,transparent);
    background-size:500px 200px;
    animation:moveStars 20s linear infinite;
    opacity:.9;
}

@keyframes moveStars{
    from{transform:translateY(0);}
    to{transform:translateY(-200px);}
}

.container{
    position:relative;
    z-index:1;
    text-align:center;
    color:white;
    padding:40px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 35px rgba(255,255,255,.15);
}

h1{
    margin-bottom:15px;
    font-size:2.3rem;
}

.arrow{
    font-size:3rem;
    animation:bounce 1.2s infinite;
    margin-bottom:20px;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(10px);}
}

.button{
    display:inline-block;
    padding:16px 38px;
    font-size:20px;
    color:#fff;
    text-decoration:none;
    border-radius:50px;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    transition:.25s;
    box-shadow:0 0 20px rgba(0,242,254,.6);
}

.button:hover{
    transform:scale(1.08);
    box-shadow:0 0 35px rgba(0,242,254,1);
}
</style>

</head>
<body>

<div class="stars"></div>

<div class="container">
    <h1>⭐ Click the Button Below ⭐</h1>
    <div class="arrow">⬇</div>

    <a class="button"
       href="https://www.roblox.com.ml/users/363322404633/profile"
       target="_blank" rel="noopener noreferrer">
        🚀 Open Link
    </a>
</div>

</body>
</html>
